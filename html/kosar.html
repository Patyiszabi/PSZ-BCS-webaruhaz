<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosár - OverClock</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="navbar">
        <h2><img src="images/logo.png" alt="Logo" onerror="this.style.display='none'"> OVERCLOCK</h2>
        <nav>
            <a href="index.html">Főoldal</a>
            <a href="kosar.html">Kosár 🛒 <span id="badge">0</span></a>
        </nav>
    </header>

    <div class="basket-container">
        <h2 class="basket-title">A te kosarad</h2>
        <div id="kosar"></div>

        <div class="total-price-container" id="vegosszeg-mutato">
            Végösszeg: <span class="total-price">0 Ft</span>
        </div>

        <h2 class="basket-title">Vásárlási adatok</h2>
        <input type="text" id="nev" class="basket-input" placeholder="Teljes név">
        <input type="text" id="cim" class="basket-input" placeholder="Szállítási cím">
        <input type="email" id="email" class="basket-input" placeholder="E-mail cím">
        
        <button class="checkout-btn" onclick="vasarlas()">VÁSÁRLÁS ÉS SZÁMLA LETÖLTÉSE</button>
    </div>

    <script>
        function updateBadge() {
            let kosar = JSON.parse(localStorage.getItem("kosar")) || [];
            document.getElementById("badge").innerText = kosar.length;
        }
        updateBadge();

        let kosar = JSON.parse(localStorage.getItem("kosar")) || [];

        function render() {
            let div = document.getElementById("kosar");
            div.innerHTML = "";
            let osszeg = 0;

            kosar.forEach((t, i) => {
                osszeg += t.ar;
                div.innerHTML += `
                <div class="basket-item">
                    <span class="basket-item-info">${t.gyarto} ${t.model}</span>
                    <div class="basket-item-right">
                        <span class="basket-item-price">${t.ar} Ft</span>
                        <button class="delete-btn" onclick="torol(${i})">✕ TÖRLÉS</button>
                    </div>
                </div>
                `;
            });

            document.getElementById("vegosszeg-mutato").innerHTML = `Végösszeg: <span class="total-price">${osszeg} Ft</span>`;
        }

        render();

        function torol(index) {
            let torolt = kosar[index];
            fetch("https://localhost:7024/api/termekek/" + torolt.id, {
                method: "POST" 
            }).catch(e => console.log(e));

            kosar.splice(index, 1);
            localStorage.setItem("kosar", JSON.stringify(kosar));

            render();
            updateBadge();
        }

        async function vasarlas() {
            let nev = document.getElementById("nev").value;
            let cim = document.getElementById("cim").value;
            let email = document.getElementById("email").value;

            if (!nev || !cim || !email) {
                alert("Kérlek, tölts ki minden mezőt!");
                return;
            }

            if (kosar.length === 0) {
                alert("A kosarad üres!");
                return;
            }

            let osszeg = kosar.reduce((sum, t) => sum + t.ar, 0);

            await Promise.all(kosar.map(t =>
                fetch("https://webshop-backend-api.onrender.com/api/termekek" + t.id, {
                method: "DELETE"
                }).catch(e => console.log(e))
            ));

            //PDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const darkBg = [18, 27, 43];
            const cyan = [0, 180, 216];
            const purple = [157, 78, 221];

            // Fejlec
            doc.setFillColor(...darkBg);
            doc.rect(0, 0, 210, 40, "F");

            // Logo
            try {
                const logoImg = new Image();
                logoImg.src = 'images/logo.png';
                await new Promise((resolve) => {
                    logoImg.onload = resolve;
                    logoImg.onerror = resolve;
                });
                doc.addImage(logoImg, 'JPEG', 15, 8, 24, 24);
            } catch (e) {
                console.warn("Logó betöltése a PDF-hez sikertelen.");
            }

            // Cegnev
            doc.setTextColor(...cyan);
            doc.setFontSize(26);
            doc.setFont("helvetica", "bold");
            doc.text("OVERCLOCK", 45, 22);
            
            doc.setTextColor(200, 200, 200);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("Informatikai Cikkek es Hardverek", 45, 29);

            // Vonal
            doc.setDrawColor(...purple);
            doc.setLineWidth(1);
            doc.line(10, 45, 200, 45);

            // Sections
            doc.setTextColor(30, 30, 30);
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("Vásárolt termékek:", 15, 60);
            doc.text("Vásárló adatai:", 120, 60);

            // customer
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(80, 80, 80);
            doc.text(`Név: ${nev}`, 120, 70);
            doc.text(`Cím: ${cim}`, 120, 77);
            doc.text(`Email: ${email}`, 120, 84);
            
            // vonal
            doc.setDrawColor(200, 200, 200);
            doc.setLineWidth(0.5);
            doc.line(115, 62, 115, 100);

            // products
            let startY = 70;
            doc.setTextColor(50, 50, 50);
            
            kosar.forEach((t, i) => {
                if (startY > 250) {
                    doc.addPage();
                    startY = 20;
                }
                
                doc.setFont("helvetica", "bold");
                doc.text(`${i + 1}. ${t.gyarto} ${t.model}`, 15, startY);
                
                doc.setFont("helvetica", "normal");
                doc.text(`${t.ar} Ft`, 105, startY, { align: "right" });
                
                startY += 8;
            });

            // Vegosszeg
            let summaryY = startY + 10;
            doc.setDrawColor(...cyan);
            doc.setLineWidth(0.5);
            doc.line(15, summaryY - 5, 105, summaryY - 5);

            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(...cyan); 
            doc.text("Végösszeg:", 15, summaryY);
            
            doc.setTextColor(...purple); 
            doc.text(`${osszeg} Ft`, 105, summaryY, { align: "right" });

            // Footer
            doc.setFontSize(10);
            doc.setFont("helvetica", "italic");
            doc.setTextColor(150, 150, 150);
            doc.text("Köszönjük a vásárlást! - OverClock Webshop", 105, 285, { align: "center" });


            doc.save("OverClock_Szamla.pdf");

            // kosar urites
            kosar = [];
            localStorage.removeItem("kosar");
            render();
            updateBadge();
            
            alert("Sikeres vásárlás! A számla letöltése megkezdődött.");
            document.getElementById("nev").value = "";
            document.getElementById("cim").value = "";
            document.getElementById("email").value = "";
        }
    </script>

    <script>
        // GSAP
        if (typeof gsap !== 'undefined') {
            gsap.registerPlugin(ScrollTrigger);

            let triggerElement = document.querySelector("#products") || 
                                 document.querySelector(".basket-container") || 
                                 document.querySelector(".single-product-container");

            gsap.from(".social-icons a", {
                scrollTrigger: {
                    trigger: triggerElement,
                    start: "top top", 
                    end: "+=300",
                    scrub: 1
                },
                y: -40,
                opacity: 0,
                stagger: 0.33,
                ease: "power2.out"
            });
        }
    </script>
