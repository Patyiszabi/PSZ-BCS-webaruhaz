<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Webshop</title>
<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
<h2>OverClock</h2>

<nav>
<a href="index.html">Főoldal</a>
<a href="kosar.html">Kosár 🛒 <span id="badge">0</span></a>
</nav>
</header>

<div class="products" id="products"></div>

<script>

function updateBadge(){
let kosar=JSON.parse(localStorage.getItem("kosar"))||[];
document.getElementById("badge").innerText=kosar.length;
}
updateBadge();

fetch("https://localhost:7024/api/termekek")
.then(r=>r.json())
.then(data=>{

let container=document.getElementById("products");

data.forEach(t=>{

container.innerHTML+=`
<div class="product" onclick="termek(${t.id})">
<img src="${t.kep}">
<h3>${t.gyarto} ${t.model}</h3>
<p>${t.tipus}</p>
<p>${t.ar} Ft</p>
<button class="add-to-cart-btn">Kosárba</button>
</div>
`;

});

});

function termek(id){
location.href="termek.html?id="+id;
}

</script>

</body>
</html>
