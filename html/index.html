<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>OverClock Webshop</title>

<style>

body{
font-family:Segoe UI;
background:#0f2a44;
color:white;
margin:0;
}

header{
display:flex;
justify-content:space-between;
padding:20px;
background:#132d52;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
padding:40px;
}

.product{
background:#1c3a5c;
padding:15px;
border-radius:10px;
cursor:pointer;
text-align:center;
}

.product img{
width:100%;
height:180px;
object-fit:cover;
}

.price{
font-size:20px;
color:#7edbff;
margin-top:10px;
}

</style>
</head>

<body>

<header>
<h2>OverClock</h2>

<nav>
<a href="index.html">Főoldal</a>
<a href="kosar.html">Kosár 🛒</a>
</nav>

</header>

<div class="products" id="products"></div>

<script>

fetch("https://localhost:7024/api/termekek")
.then(res=>res.json())
.then(data=>{

let container=document.getElementById("products");

data.forEach(t=>{

container.innerHTML+=`
<div class="product" onclick="termek(${t.id})">
<img src="${t.kep}">
<h3>${t.gyarto} ${t.model}</h3>
<p>${t.tipus}</p>
<div class="price">${t.ar} Ft</div>
</div>
`;

});

});

function termek(id){

location.href="termek.html?id="+id;

}

</script>

</body>
</html>
