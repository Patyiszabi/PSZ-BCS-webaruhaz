<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termék - OverClock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>

    <header id="navbar">
        <h2><img src="images/logo.png" alt="Logo" onerror="this.style.display='none'"> OVERCLOCK</h2>
        <nav>
            <a href="index.html">Főoldal</a>
            <a href="kosar.html">Kosár 🛒 <span id="badge">0</span></a>
        </nav>
    </header>

    <div id="termek-kontener"></div>

    <script>
        function updateBadge() {
            let kosar = JSON.parse(localStorage.getItem("kosar")) || [];
            document.getElementById("badge").innerText = kosar.length;
        }
        updateBadge();

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        // API call
        fetch("https://webshop-backend-api.onrender.com/api/termekek/" + id)
        .then(r => r.json())
        .then(t => {
            // Error handling
            let kep = t.kep ? t.kep : "https://via.placeholder.com/600x400/1c3a5c/ffffff?text=Kép+hiányzik";

            // HTML structure
            document.getElementById("termek-kontener").innerHTML = `
                <div class="single-product-container">
                    <img src="${kep}" alt="${t.model}" class="single-product-image">
                    
                    <div class="single-product-details">
                        <h1 class="single-product-title">${t.gyarto} ${t.model}</h1>
                        <div class="single-product-price">${t.ar} Ft</div>
                        
                        <div class="single-product-desc">
                            ${t.leiras ? t.leiras : "Ez a termék tökéletes választás minden modern informatikai feladathoz. Kiemelkedő teljesítmény és megbízhatóság jellemzi."}
                        </div>
                        
                        <div class="single-product-tech">
                            <strong>Műszaki adatok:</strong><br>
                            ${t.tech ? t.tech : "Sebesség: Gyors<br>Szabvány: A legújabb<br>Csatlakozók: Modern portok"}
                        </div>
                        
                        <button class="single-cart-btn" onclick="kosarba()">Kosárba 🛒</button>
                    </div>
                </div>
            `;

            window.termek = t;
        })
        .catch(err => {
            console.error("Hiba a termék betöltésekor:", err);
            document.getElementById("termek-kontener").innerHTML = "<h2 style='text-align:center; margin-top: 150px;'>A termék nem található.</h2>";
        });

        // Kosárba
        function kosarba() {
            if(!window.termek) return;

            let kosar = JSON.parse(localStorage.getItem("kosar")) || [];
            kosar.push(window.termek);
            localStorage.setItem("kosar", JSON.stringify(kosar));

            updateBadge();

            alert(window.termek.gyarto + " " + window.termek.model + " sikeresen a kosárba került!");
        }
    </script>

    <script>

        // GSAP - Social icons scroll animation
        if (typeof gsap !== 'undefined') {
            gsap.registerPlugin(ScrollTrigger);

            let triggerElement = document.querySelector("#products") || 
                                 document.querySelector(".basket-container") || 
                                 document.querySelector(".single-product-container");

            gsap.from(".social-icons a", {
                scrollTrigger: {
                    trigger: triggerElement,
                    start: "top top",
                    end: "+=300",
                    scrub: 1
                },
                y: -40,
                opacity: 0,
                stagger: 0.33,
                ease: "power2.out"
            });
        }
    </script>
