<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Termék</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<header>
<h2>OverClock</h2>
<nav>
<a href="index.html">Főoldal</a>
<a href="kosar.html">Kosár 🛒 <span id="badge">0</span></a>
</nav>
</header>

<div class="container">
<div id="termek"></div>
<button onclick="kosarba()">Kosárba</button>
</div>

<script>

function updateBadge(){
let kosar=JSON.parse(localStorage.getItem("kosar"))||[];
document.getElementById("badge").innerText=kosar.length;
}
updateBadge();

const params=new URLSearchParams(window.location.search);
const id=params.get("id");

fetch("https://localhost:7024/api/termekek/"+id)
.then(r=>r.json())
.then(t=>{

document.getElementById("termek").innerHTML=`
<h1>${t.gyarto} ${t.model}</h1>
<img src="${t.kep}" width="300">
<p>${t.leiras}</p>
<p>${t.tech}</p>
<h2>${t.ar} Ft</h2>
`;

window.termek=t;

});

function kosarba(){

let kosar=JSON.parse(localStorage.getItem("kosar"))||[];
kosar.push(window.termek);
localStorage.setItem("kosar",JSON.stringify(kosar));

updateBadge();

alert("Kosárba téve!");

}

</script>

</body>
</html>
